<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hausbr.com - Ecossistema Imobiliário</title>
    <meta name="description" content="Haus - O ecossistema imobiliário agora sem fronteiras. Acesse ativos de alta performance em qualquer região com inteligência artificial.">
    <meta name="facebook-domain-verification" content="p036cmy9yty8ucol8nx9l8huwp5rj3" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Hausbr.com - Ecossistema Imobiliário">
    <meta property="og:description" content="O ecossistema imobiliário agora sem fronteiras.">
    <meta property="og:image" content="Haus - Logo.png">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="style.css?v=27">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- P5.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>

<body>
    <h1 style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;">Haus - O ecossistema imobiliário agora sem fronteiras</h1>
    <header class="haus-header">
        <div class="pill logo-pill">
            <img src="Haus - Logo.png" alt="Haus Logo" class="logo-img">
        </div>

        <div class="pill menu-pill">
            <span class="menu-item">Inventário</span>
            <span class="menu-item">Inteligência</span>
            <span class="menu-item">Conexões</span>
        </div>

        <div class="pill status-pill">
            <span class="day" id="current-day">Domingo</span>
            <span class="date" id="current-date">Março 15, 2026</span>
        </div>

        <button class="pill login-btn" id="request-access-btn">
            <span class="login-text">Solicite Acesso</span>
            <svg class="login-icon" width="12" height="12" viewBox="0 0 24 24" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M8 5V19L19 12L8 5Z" fill="#02df82" />
            </svg>
        </button>
    </header>

    <!-- Modal de Solicitação de Acesso -->
    <div class="modal-overlay" id="access-modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M18 6L6 18M6 6L18 18" stroke="#666" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <h2>Solicite Acesso</h2>
            <p class="modal-subtitle">Preencha seus dados para entrar na lista de espera.</p>
            <form id="access-form">
                <div class="form-group">
                    <label for="access-name">Nome Completo</label>
                    <input type="text" id="access-name" name="name" placeholder="Seu nome" required>
                </div>
                <div class="form-group">
                    <label for="access-email">E-mail</label>
                    <input type="email" id="access-email" name="email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="access-whatsapp">WhatsApp</label>
                    <input type="tel" id="access-whatsapp" name="whatsapp" placeholder="+55 (00) 00000-0000" required>
                </div>
                <div class="form-group">
                    <label for="access-company">Empresa / CRECI</label>
                    <input type="text" id="access-company" name="company" placeholder="Nome da empresa ou CRECI" required>
                </div>
                <button type="submit" class="modal-submit">Entrar na Lista de Espera</button>
            </form>
            <div class="modal-success" id="modal-success" style="display: none;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="10" fill="#02df82"/>
                    <path d="M8 12L11 15L16 9" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h3>Recebido!</h3>
                <p>Entraremos em contato em breve.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
