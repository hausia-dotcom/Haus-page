<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haus.com - Ecossistema Imobiliario</title>
    <link rel="stylesheet" href="style.css?v=26">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- P5.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>

<body>
    <header class="haus-header">
        <div class="pill logo-pill">
            <img src="Haus - Logo.png" alt="Haus Logo" class="logo-img">
        </div>

        <div class="pill menu-pill">
            <span class="menu-item active">Em breve</span>
            <span class="menu-item">Inventário</span>
            <span class="menu-item">Inteligência</span>
            <span class="menu-item">Conexões</span>
        </div>

        <div class="pill status-pill">
            <span class="day" id="current-day">Domingo</span>
            <span class="date" id="current-date">Março 15, 2026</span>
        </div>

        <button class="pill login-btn">
            <span class="login-text">Login</span>
            <svg class="login-icon" width="12" height="12" viewBox="0 0 24 24" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M8 5V19L19 12L8 5Z" fill="#02df82" />
            </svg>
        </button>

        <!-- Menu Mobile Disruptivo (+) -->
        <div class="haus-mobile-menu" onclick="this.classList.toggle('open')">
            <span></span>
            <span></span>
        </div>
    </header>

    <footer class="haus-footer">
        <span class="footer-text">© 2026 Haus Tecnologia e Inteligência Imobiliária Ltda &bull; CNPJ 00.000.000/0001-00 &bull; <span class="footer-link">Termos e Privacidade</span></span>
    </footer>

    <script src="script.js"></script>
</body>

</html>
